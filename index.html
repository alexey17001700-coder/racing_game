<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ГОНКИ 🏎️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0b0e14; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }
  #hud {
    position:absolute; top:0; left:0; right:0; padding:14px 18px;
    display:flex; justify-content:space-between; align-items:flex-start;
    color:#fff; font-weight:700; pointer-events:none; text-shadow:0 2px 8px rgba(0,0,0,.8);
  }
  .box { background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:8px 14px; backdrop-filter:blur(6px); }
  #score { font-size:22px; }
  #score span { color:#ffd54a; }
  #best { font-size:12px; opacity:.75; font-weight:600; margin-top:2px; }
  #ver { font-size:11px; opacity:.55; font-weight:700; margin-top:3px; letter-spacing:.5px; }
  #speed { font-size:16px; color:#4ad6ff; }
  #verBadge {
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:11px; font-weight:700; opacity:.45; letter-spacing:1px;
    pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.8); z-index:6;
  }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(20,26,40,.85), rgba(5,7,12,.96));
    color:#fff; text-align:center; padding:24px; z-index:10;
  }
  #overlay.hide { display:none; }
  h1 { font-size:44px; letter-spacing:4px; margin-bottom:6px; background:linear-gradient(90deg,#ffd54a,#ff6b6b,#4ad6ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { opacity:.7; font-size:14px; margin-bottom:26px; }
  button {
    font:inherit; font-weight:800; font-size:18px; letter-spacing:1px;
    padding:16px 46px; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#ffd54a,#ff9f1a); color:#1a1200;
    box-shadow:0 8px 30px rgba(255,180,40,.35); transition:transform .12s;
  }
  button:active { transform:scale(.95); }
  .keys { margin-top:26px; font-size:13px; opacity:.6; line-height:1.9; }
  .keys b { color:#4ad6ff; }
  #final { font-size:20px; margin-bottom:8px; }
  #final b { color:#ffd54a; font-size:30px; }
  #controls { position:absolute; bottom:0; left:0; right:0; display:none; justify-content:space-between; padding:0 20px 24px; z-index:5; }
  #controls button { width:110px; height:110px; border-radius:50%; font-size:40px; padding:0; background:rgba(255,255,255,.1); color:#fff; box-shadow:none; border:2px solid rgba(255,255,255,.2); }
  @media (pointer:coarse) { #controls { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="box">
      <div id="score">Очки: <span>0</span></div>
      <div id="best">Рекорд: 0</div>
      <div id="ver">версия —</div>
    </div>
    <div class="box"><div id="speed">0 км/ч</div></div>
  </div>

  <div id="controls">
    <button id="btnL">◀</button>
    <button id="btnR">▶</button>
  </div>

  <div id="verBadge">—</div>

  <button id="updBtn" style="display:none;position:absolute;top:74px;right:18px;z-index:20;font-size:12px;font-weight:800;letter-spacing:.5px;padding:10px 16px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#4ad6ff,#2e86de);color:#04121c;box-shadow:0 6px 20px rgba(74,214,255,.45)">⬆ Новая версия — обновить</button>

  <div id="overlay">
    <h1>ГОНКИ</h1>
    <div class="sub">Седаны, спорткары, внедорожники, грузовики, автобусы и мотоциклы — уворачивайся от всех</div>
    <div class="sub" style="margin-bottom:14px;font-size:12px;opacity:.5">Версия: <b id="verOverlay" style="color:#4ad6ff">—</b></div>
    <div id="final" style="display:none"></div>
    <button id="startBtn">СТАРТ</button>
    <div class="keys">
      <b>←</b> / <b>→</b> — руль &nbsp;•&nbsp; <b>A</b> / <b>D</b> — тоже<br>
      На телефоне — кнопки внизу или свайп
    </div>
  </div>
</div>

<script>
(function(){
  const VERSION = 'v1.4';
  const BUILD = 'build 4';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const finalEl = document.getElementById('final');
  const scoreEl = document.querySelector('#score span');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');

  let W=0, H=0, DPR=Math.min(window.devicePixelRatio||1, 2);
  let road = { x:0, w:0 };

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    road.w = Math.min(W*0.78, 520);
    road.x = (W - road.w)/2;
  }
  window.addEventListener('resize', resize);
  resize();

  const LANES = 3;
  const laneW = () => road.w / LANES;
  const laneCenter = i => road.x + laneW()*(i+0.5);

  const CAR_W = () => Math.min(laneW()*0.62, 62);
  const CAR_H = () => CAR_W()*1.85;

  // ---- типы транспорта ----
  const TYPES = {
    car:   { wf:0.62, maxW:62, hf:1.85, weight:28 },
    sport: { wf:0.58, maxW:58, hf:1.72, weight:14 },
    suv:   { wf:0.70, maxW:70, hf:1.95, weight:16 },
    truck: { wf:0.84, maxW:84, hf:3.00, weight:14 },
    bus:   { wf:0.86, maxW:86, hf:3.30, weight:12 },
    moto:  { wf:0.40, maxW:40, hf:1.60, weight:10 }
  };
  const PALETTES = {
    car:   ['#ff5c5c','#ffb84a','#7c6bff','#3ddc97','#ff7ad9','#4ad6ff'],
    sport: ['#ff2d55','#ffd54a','#00e5ff','#ff6b00'],
    suv:   ['#5b6b7a','#2f7d5b','#8a5a2b','#3a4a5a'],
    truck: ['#e8edf2','#3b6ea5','#c0392b','#2f7d5b'],
    bus:   ['#ffb300','#e74c3c','#2e86de','#27ae60'],
    moto:  ['#ff2d55','#00e5ff','#ffd54a','#9b59b6']
  };
  function typeSize(id){
    const t = TYPES[id];
    const w = Math.min(laneW()*t.wf, t.maxW);
    return { w, h: w*t.hf };
  }
  function pickType(){
    const ids = Object.keys(TYPES);
    let total = 0; for(const id of ids) total += TYPES[id].weight;
    let r = Math.random()*total;
    for(const id of ids){ r -= TYPES[id].weight; if(r <= 0) return id; }
    return 'car';
  }

  let state = 'menu'; // menu | play | over
  let player, enemies, particles, stripes, score, best, speed, spawnT, roadOffset, shake, time;

  best = Math.floor(+(localStorage.getItem('racing_best')||0));
  bestEl.textContent = 'Рекорд: ' + best;

  document.getElementById('ver').textContent = 'версия ' + VERSION;
  document.getElementById('verBadge').textContent = 'ГОНКИ ' + VERSION + ' · ' + BUILD;
  document.getElementById('verOverlay').textContent = VERSION + ' (' + BUILD + ')';

  function reset(){
    player = { lane:1, x:laneCenter(1), y:H - CAR_H()*1.6, vx:0, tilt:0 };
    enemies = [];
    particles = [];
    stripes = [];
    score = 0; speed = 0; spawnT = 0; roadOffset = 0; shake = 0; time = 0;
    for(let i=0;i<40;i++) stripes.push({ y: Math.random()*H });
    scoreEl.textContent = '0';
  }

  // ---- input ----
  const keys = {};
  let touchX = null, swipeStart = null;

  window.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()] = true;
    if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
    if(e.key === ' ' && state !== 'play') start();
  });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  function pointerDown(x){ swipeStart = { x, t:performance.now() }; touchX = x; }
  function pointerMove(x){ if(touchX!==null) touchX = x; }
  function pointerUp(x){
    if(swipeStart){
      const dx = x - swipeStart.x;
      const dt = performance.now() - swipeStart.t;
      if(Math.abs(dx) > 30 && dt < 500){
        if(dx < 0) moveLane(-1); else moveLane(1);
      }
    }
    touchX = null; swipeStart = null;
  }

  cv.addEventListener('pointerdown', e=>pointerDown(e.clientX));
  cv.addEventListener('pointermove', e=>pointerMove(e.clientX));
  cv.addEventListener('pointerup', e=>pointerUp(e.clientX));
  cv.addEventListener('pointercancel', ()=>{ touchX=null; swipeStart=null; });

  document.getElementById('btnL').addEventListener('pointerdown', e=>{ e.preventDefault(); moveLane(-1); });
  document.getElementById('btnR').addEventListener('pointerdown', e=>{ e.preventDefault(); moveLane(1); });

  function moveLane(d){
    if(state !== 'play') return;
    const n = Math.max(0, Math.min(LANES-1, player.lane + d));
    if(n !== player.lane){ player.lane = n; player.tilt = d*0.35; }
  }

  // ---- game ----
  function start(){
    reset();
    state = 'play';
    overlay.classList.add('hide');
  }

  function gameOver(){
    state = 'over';
    shake = 18;
    score = Math.floor(score);
    if(score > best){ best = score; localStorage.setItem('racing_best', best); }
    bestEl.textContent = 'Рекорд: ' + Math.floor(best);
    finalEl.style.display = 'block';
    finalEl.innerHTML = 'Очки: <b>'+score+'</b><br><span style="font-size:14px;opacity:.7">Рекорд: '+Math.floor(best)+'</span>';
    startBtn.textContent = 'ЕЩЁ РАЗ';
    overlay.classList.remove('hide');
  }

  function spawnEnemy(){
    const lane = Math.floor(Math.random()*LANES);
    const type = pickType();
    const size = typeSize(type);
    // не спавним, если близко к другому врагу в той же полосе
    for(const e of enemies){
      if(e.lane === lane && e.y < e.h*1.6 + size.h*0.6) return;
    }
    const pal = PALETTES[type];
    enemies.push({
      lane, x: laneCenter(lane), y: -size.h*1.2,
      w: size.w, h: size.h, type,
      color: pal[Math.floor(Math.random()*pal.length)],
      vy: 0
    });
  }

  function burst(x,y,color,n){
    for(let i=0;i<n;i++){
      particles.push({
        x, y,
        vx:(Math.random()-0.5)*8,
        vy:(Math.random()-0.5)*8 - 2,
        life:1, color, size: 2+Math.random()*4
      });
    }
  }

  function update(dt){
    time += dt;
    if(state !== 'play'){
      if(shake > 0) shake *= 0.9;
      return;
    }

    // скорость растёт со временем
    speed = Math.min(1, time/45);
    const baseSpeed = 320 + speed*680; // px/sec
    roadOffset += baseSpeed*dt;
    score += dt * (10 + speed*40);

    // руль
    let steer = 0;
    if(keys['arrowleft']||keys['a']) steer -= 1;
    if(keys['arrowright']||keys['d']) steer += 1;
    if(touchX !== null){
      const target = Math.max(road.x+CAR_W()/2, Math.min(road.x+road.w-CAR_W()/2, touchX));
      player.x += (target - player.x) * Math.min(1, dt*10);
      player.tilt += ((target-player.x)*0.004 - player.tilt)*0.2;
    } else {
      const targetX = laneCenter(player.lane);
      player.x += (targetX - player.x) * Math.min(1, dt*9);
      player.tilt += (steer*0.3 - player.tilt) * Math.min(1, dt*10);
    }
    player.x = Math.max(road.x+CAR_W()/2, Math.min(road.x+road.w-CAR_W()/2, player.x));

    // спавн
    spawnT -= dt;
    if(spawnT <= 0){
      spawnEnemy();
      spawnT = Math.max(0.32, 0.95 - speed*0.55) * (0.75 + Math.random()*0.6);
    }

    // враги
    const pw = CAR_W(), ph = CAR_H();
    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      e.y += baseSpeed*dt;
      // мягкое доведение до центра полосы
      e.x += (laneCenter(e.lane) - e.x) * Math.min(1, dt*4);

      // столкновение
      if(Math.abs(e.x - player.x) < (pw + e.w)*0.40 && Math.abs(e.y - player.y) < (ph + e.h)*0.40){
        burst(player.x, player.y, '#ffd54a', 40);
        burst(e.x, e.y, e.color, 30);
        gameOver();
        return;
      }
      if(e.y > H + e.h){ enemies.splice(i,1); score += Math.round(8 + e.h/12); }
    }

    // частицы
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= dt*1.6;
      if(p.life <= 0) particles.splice(i,1);
    }

    // полосы разметки
    for(const s of stripes){
      s.y += baseSpeed*dt;
      if(s.y > H) s.y -= H + Math.random()*40;
    }

    if(shake > 0) shake *= 0.9;
    scoreEl.textContent = Math.floor(score);
    speedEl.textContent = Math.floor(60 + speed*240) + ' км/ч';
  }

  // ---- render ----
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ===== детализированная отрисовка (псевдо-3D) =====
  function lg(x0,y0,x1,y1,stops){
    const g = ctx.createLinearGradient(x0,y0,x1,y1);
    for(let i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
    return g;
  }
  function rr(x,y,w,h,r){ roundRect(x,y,w,h,r); ctx.fill(); }

  function dropShadow(w,h){
    ctx.save();
    ctx.globalAlpha = .40; ctx.fillStyle = '#000';
    rr(-w/2+4, -h/2+9, w*1.02, h*1.02, w*0.22);
    ctx.globalAlpha = .20;
    rr(-w/2+9, -h/2+16, w*1.08, h*1.05, w*0.26);
    ctx.restore();
  }

  function wheel(x,y,w,h){
    ctx.fillStyle = lg(x,0,x+w,0,[[0,'#06060a'],[.45,'#2b3038'],[1,'#040406']]);
    rr(x,y,w,h,Math.min(w,h)*0.42);
    ctx.fillStyle = lg(x,0,x+w,0,[[0,'#6d747e'],[.42,'#d8dee6'],[1,'#545a64']]);
    rr(x+w*0.26, y+h*0.16, w*0.48, h*0.68, Math.min(w,h)*0.32);
  }

  function glass(x,y,w,h,r){
    ctx.fillStyle = lg(x,y,x+w,y+h,[[0,'#0c1524'],[.45,'#1d2f4c'],[1,'#080f1c']]);
    rr(x,y,w,h,r);
    ctx.save(); ctx.globalAlpha = .26; ctx.fillStyle = '#d6ecff';
    ctx.beginPath();
    ctx.moveTo(x+w*0.10, y+h); ctx.lineTo(x+w*0.40, y);
    ctx.lineTo(x+w*0.58, y);  ctx.lineTo(x+w*0.28, y+h);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function headlight(x,y,w,h,isPlayer){
    ctx.save();
    ctx.shadowColor = isPlayer ? 'rgba(255,246,190,.95)' : 'rgba(255,90,90,.85)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = lg(x,0,x+w,0,[[0,'#fffdf2'],[.5, isPlayer?'#fff0a8':'#ff9a9a'],[1,'#ffe9a0']]);
    rr(x,y,w,h,h*0.45);
    ctx.restore();
  }

  function taillight(x,y,w,h){
    ctx.save();
    ctx.shadowColor = 'rgba(255,45,45,.9)'; ctx.shadowBlur = 12;
    ctx.fillStyle = lg(x,0,x+w,0,[[0,'#ff6060'],[.5,'#c81f1f'],[1,'#8a0f0f']]);
    rr(x,y,w,h,h*0.45);
    ctx.restore();
  }

  function plate(x,y,w,h){
    ctx.fillStyle = '#eef1f5'; rr(x,y,w,h,1.5);
    ctx.fillStyle = 'rgba(25,40,80,.5)'; rr(x+w*0.14, y+h*0.28, w*0.72, h*0.44, 1);
  }

  function bodyPaint(w,h,color){
    ctx.fillStyle = lg(-w/2,0,w/2,0,[
      [0, shade(color, 58)],
      [.13, shade(color, 20)],
      [.48, color],
      [.80, shade(color,-32)],
      [1, shade(color,-64)]
    ]);
    rr(-w/2,-h/2,w,h,w*0.20);
    ctx.fillStyle = lg(0,-h/2,0,h/2,[[0,'rgba(255,255,255,.16)'],[.35,'rgba(255,255,255,0)'],[1,'rgba(0,0,0,.22)']]);
    rr(-w/2,-h/2,w,h,w*0.20);
  }

  function drawVehicle(x,y,w,h,type,color,tilt,isPlayer){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(tilt*0.25);
    if(type === 'truck') drawTruck(w,h,color,isPlayer);
    else if(type === 'bus') drawBus(w,h,color,isPlayer);
    else if(type === 'moto') drawMoto(w,h,color,isPlayer);
    else drawCarBody(w,h,color,isPlayer,type);
    ctx.restore();
  }

  function drawCarBody(w,h,color,isPlayer,type){
    const isSport = type === 'sport', isSuv = type === 'suv';
    dropShadow(w,h);

    // порог (тёмный низ кузова)
    ctx.fillStyle = lg(-w/2,0,w/2,0,[[0,shade(color,-62)],[.5,shade(color,-40)],[1,shade(color,-74)]]);
    rr(-w/2,-h/2,w,h,w*0.20);

    // кузов
    const bw = w*0.95, bh = h*0.97;
    bodyPaint(bw,bh,color);

    // линии капота и багажника
    ctx.strokeStyle = 'rgba(0,0,0,.20)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-bw*0.44,-bh*0.31); ctx.lineTo(bw*0.44,-bh*0.31); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-bw*0.44, bh*0.29); ctx.lineTo(bw*0.44, bh*0.29); ctx.stroke();

    // крыша
    const rw = bw*(isSport?0.66:0.72), rh = bh*(isSport?0.28:0.32);
    ctx.fillStyle = lg(-rw/2,0,rw/2,0,[[0,shade(color,42)],[.45,shade(color,12)],[1,shade(color,-42)]]);
    rr(-rw/2, -rh/2, rw, rh, rw*0.18);

    // стёкла
    glass(-bw*0.36, -bh*0.35, bw*0.72, bh*0.17, bw*0.07);
    glass(-bw*0.34,  bh*0.19, bw*0.68, bh*0.13, bw*0.07);
    glass(-bw*0.45, -bh*0.13, bw*0.11, bh*0.24, 3);
    glass( bw*0.34, -bh*0.13, bw*0.11, bh*0.24, 3);

    // зеркала
    ctx.fillStyle = shade(color,-28);
    rr(-bw*0.56, -bh*0.30, bw*0.12, bh*0.05, 2);
    rr( bw*0.44, -bh*0.30, bw*0.12, bh*0.05, 2);

    // фары, стопы, номер, решётка
    headlight(-bw*0.40, -bh*0.47, bw*0.24, bh*0.055, isPlayer);
    headlight( bw*0.16, -bh*0.47, bw*0.24, bh*0.055, isPlayer);
    taillight(-bw*0.40,  bh*0.42, bw*0.22, bh*0.05);
    taillight( bw*0.18,  bh*0.42, bw*0.22, bh*0.05);
    plate(-bw*0.13, bh*0.44, bw*0.26, bh*0.045);
    ctx.fillStyle = 'rgba(15,18,24,.85)';
    rr(-bw*0.16, -bh*0.47, bw*0.32, bh*0.05, 2);

    // детали по типу
    if(isSport){
      ctx.fillStyle = '#15181e';
      rr(-bw*0.56, bh*0.33, bw*1.12, bh*0.06, 3);
      ctx.fillStyle = 'rgba(255,255,255,.32)';
      rr(-bw*0.10, -bh*0.46, bw*0.07, bh*0.92, 2);
      rr( bw*0.03, -bh*0.46, bw*0.07, bh*0.92, 2);
      ctx.fillStyle = '#1b1f26';
      rr(-bw*0.20, -bh*0.43, bw*0.40, bh*0.035, 2);
    }
    if(isSuv){
      ctx.fillStyle = '#2b3038';
      rr(-rw*0.54, -rh*0.62, rw*0.10, rh*1.24, 2);
      rr( rw*0.44, -rh*0.62, rw*0.10, rh*1.24, 2);
      ctx.fillStyle = '#33383f';
      rr(-rw*0.36, -rh*0.34, rw*0.72, rh*0.62, 4);
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      rr(-rw*0.36, -rh*0.34, rw*0.72, rh*0.16, 4);
      ctx.fillStyle = '#20242a';
      rr(-bw*0.46, -bh*0.50, bw*0.92, bh*0.045, 3);
    }

    // колёса
    const ww = w*0.15, wh = h*0.21;
    wheel(-w*0.585, -h*0.32, ww, wh);
    wheel( w*0.435, -h*0.32, ww, wh);
    wheel(-w*0.585,  h*0.11, ww, wh);
    wheel( w*0.435,  h*0.11, ww, wh);
  }

  function drawTruck(w,h,color,isPlayer){
    const cabH = h*0.30;
    // прицеп
    ctx.fillStyle = '#e9edf2';
    roundRect(-w/2, -h/2 + cabH*1.05, w, h - cabH*1.05, w*0.10); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    roundRect(-w/2, -h/2 + cabH*1.05, w, (h - cabH*1.05)*0.16, w*0.10); ctx.fill();
    // рёбра прицепа
    ctx.strokeStyle = 'rgba(0,0,0,.13)'; ctx.lineWidth = 2;
    for(let i=1;i<5;i++){
      const yy = -h/2 + cabH*1.05 + (h - cabH*1.05)*i/5;
      ctx.beginPath(); ctx.moveTo(-w/2+4, yy); ctx.lineTo(w/2-4, yy); ctx.stroke();
    }
    // кабина
    ctx.fillStyle = bodyGrad(w,color);
    roundRect(-w/2, -h/2, w, cabH*1.15, w*0.16); ctx.fill();
    // лобовое
    ctx.fillStyle = 'rgba(15,25,45,.85)';
    roundRect(-w*0.36, -h*0.27, w*0.72, h*0.13, w*0.08); ctx.fill();
    // фары
    ctx.fillStyle = isPlayer ? '#fff6c0' : '#ff5c5c';
    roundRect(-w*0.42, -h*0.48, w*0.20, h*0.05, 3); ctx.fill();
    roundRect( w*0.22, -h*0.48, w*0.20, h*0.05, 3); ctx.fill();
    // колёса
    ctx.fillStyle = '#111';
    for(const yy of [-h*0.40, -h*0.12, h*0.18, h*0.38]){
      roundRect(-w*0.56, yy, w*0.13, h*0.09, 3); ctx.fill();
      roundRect( w*0.43, yy, w*0.13, h*0.09, 3); ctx.fill();
    }
  }

  function drawBus(w,h,color,isPlayer){
    // кузов
    ctx.fillStyle = bodyGrad(w,color);
    roundRect(-w/2, -h/2, w, h, w*0.14); ctx.fill();
    // лобовое
    ctx.fillStyle = 'rgba(15,25,45,.85)';
    roundRect(-w*0.40, -h*0.44, w*0.80, h*0.12, w*0.06); ctx.fill();
    // боковые окна
    for(let i=0;i<6;i++){
      const yy = -h*0.26 + i*h*0.115;
      roundRect(-w*0.40, yy, w*0.80, h*0.085, w*0.05); ctx.fill();
    }
    // полоса по борту
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    roundRect(-w/2, h*0.30, w, h*0.05, 3); ctx.fill();
    // двери
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    roundRect(w*0.08, h*0.12, w*0.30, h*0.16, 4); ctx.fill();
    // фары
    ctx.fillStyle = isPlayer ? '#fff6c0' : '#ff5c5c';
    roundRect(-w*0.42, -h*0.49, w*0.20, h*0.035, 3); ctx.fill();
    roundRect( w*0.22, -h*0.49, w*0.20, h*0.035, 3); ctx.fill();
    // колёса
    ctx.fillStyle = '#111';
    roundRect(-w*0.56, -h*0.34, w*0.13, h*0.12, 3); ctx.fill();
    roundRect( w*0.43, -h*0.34, w*0.13, h*0.12, 3); ctx.fill();
    roundRect(-w*0.56,  h*0.22, w*0.13, h*0.12, 3); ctx.fill();
    roundRect( w*0.43,  h*0.22, w*0.13, h*0.12, 3); ctx.fill();
  }

  function drawMoto(w,h,color,isPlayer){
    // переднее колесо
    ctx.fillStyle = '#111';
    roundRect(-w*0.16, -h*0.50, w*0.32, h*0.16, w*0.16); ctx.fill();
    // корпус
    ctx.fillStyle = bodyGrad(w,color);
    roundRect(-w*0.34, -h*0.34, w*0.68, h*0.62, w*0.22); ctx.fill();
    // райдер
    ctx.fillStyle = '#20242c';
    roundRect(-w*0.30, -h*0.18, w*0.60, h*0.32, w*0.18); ctx.fill();
    // шлем
    ctx.fillStyle = isPlayer ? '#ffd54a' : '#e8e8e8';
    ctx.beginPath(); ctx.arc(0, -h*0.22, w*0.26, 0, Math.PI*2); ctx.fill();
    // визор
    ctx.fillStyle = 'rgba(15,25,45,.9)';
    roundRect(-w*0.22, -h*0.30, w*0.44, h*0.10, w*0.06); ctx.fill();
    // заднее колесо
    ctx.fillStyle = '#111';
    roundRect(-w*0.16, h*0.30, w*0.32, h*0.16, w*0.16); ctx.fill();
    // фара
    ctx.fillStyle = isPlayer ? '#fff6c0' : '#ff5c5c';
    roundRect(-w*0.14, -h*0.52, w*0.28, h*0.05, 3); ctx.fill();
  }

  function shade(hex, amt){
    let c = hex.replace('#','');
    if(c.length===3) c = c.split('').map(x=>x+x).join('');
    let r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    r = Math.max(0,Math.min(255,r+amt)); g = Math.max(0,Math.min(255,g+amt)); b = Math.max(0,Math.min(255,b+amt));
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  function render(){
    ctx.save();
    if(shake > 0.5){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // фон — трава
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0e2a1c'); bg.addColorStop(1,'#07160f');
    ctx.fillStyle = bg; ctx.fillRect(-40,-40,W+80,H+80);

    // дорога
    const rg = ctx.createLinearGradient(road.x,0,road.x+road.w,0);
    rg.addColorStop(0,'#2a2f3a'); rg.addColorStop(0.5,'#3a4150'); rg.addColorStop(1,'#2a2f3a');
    ctx.fillStyle = rg;
    ctx.fillRect(road.x, -40, road.w, H+80);

    // обочины
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(road.x-6, -40, 6, H+80);
    ctx.fillRect(road.x+road.w, -40, 6, H+80);

    // разметка полос
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 4;
    ctx.setLineDash([34, 30]);
    ctx.lineDashOffset = -roadOffset % 64;
    for(let i=1;i<LANES;i++){
      const x = road.x + laneW()*i;
      ctx.beginPath(); ctx.moveTo(x,-40); ctx.lineTo(x,H+40); ctx.stroke();
    }
    ctx.setLineDash([]);

    // частицы
    for(const p of particles){
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // враги
    const w = CAR_W(), h = CAR_H();
    for(const e of enemies) drawVehicle(e.x, e.y, e.w, e.h, e.type, e.color, 0, false);

    // игрок
    if(state !== 'over') drawVehicle(player.x, player.y, w, h, 'sport', '#ffd54a', player.tilt, true);

    // виньетка
    const vg = ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.85);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

    ctx.restore();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---- проверка обновлений (обход кэша GitHub Pages) ----
  const updBtn = document.getElementById('updBtn');
  function checkUpdate(){
    fetch('index.html?_=' + Date.now(), { cache:'no-store' })
      .then(r => r.text())
      .then(txt => {
        const m = txt.match(/const VERSION\s*=\s*'([^']+)'/);
        if(m && m[1] !== VERSION) updBtn.style.display = 'block';
      })
      .catch(()=>{});
  }
  updBtn.addEventListener('click', ()=>{ location.href = location.pathname + '?v=' + Date.now(); });
  checkUpdate();
  setInterval(checkUpdate, 60000);

  startBtn.addEventListener('click', start);
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
