<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ГОНКИ 🏎️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0b0e14; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }
  #hud {
    position:absolute; top:0; left:0; right:0; padding:14px 18px;
    display:flex; justify-content:space-between; align-items:flex-start;
    color:#fff; font-weight:700; pointer-events:none; text-shadow:0 2px 8px rgba(0,0,0,.8);
  }
  .box { background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:8px 14px; backdrop-filter:blur(6px); }
  #score { font-size:22px; }
  #score span { color:#ffd54a; }
  #best { font-size:12px; opacity:.75; font-weight:600; margin-top:2px; }
  #speed { font-size:16px; color:#4ad6ff; }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(20,26,40,.85), rgba(5,7,12,.96));
    color:#fff; text-align:center; padding:24px; z-index:10;
  }
  #overlay.hide { display:none; }
  h1 { font-size:44px; letter-spacing:4px; margin-bottom:6px; background:linear-gradient(90deg,#ffd54a,#ff6b6b,#4ad6ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { opacity:.7; font-size:14px; margin-bottom:26px; }
  button {
    font:inherit; font-weight:800; font-size:18px; letter-spacing:1px;
    padding:16px 46px; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#ffd54a,#ff9f1a); color:#1a1200;
    box-shadow:0 8px 30px rgba(255,180,40,.35); transition:transform .12s;
  }
  button:active { transform:scale(.95); }
  .keys { margin-top:26px; font-size:13px; opacity:.6; line-height:1.9; }
  .keys b { color:#4ad6ff; }
  #final { font-size:20px; margin-bottom:8px; }
  #final b { color:#ffd54a; font-size:30px; }
  #controls { position:absolute; bottom:0; left:0; right:0; display:none; justify-content:space-between; padding:0 20px 24px; z-index:5; }
  #controls button { width:110px; height:110px; border-radius:50%; font-size:40px; padding:0; background:rgba(255,255,255,.1); color:#fff; box-shadow:none; border:2px solid rgba(255,255,255,.2); }
  @media (pointer:coarse) { #controls { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="box">
      <div id="score">Очки: <span>0</span></div>
      <div id="best">Рекорд: 0</div>
    </div>
    <div class="box"><div id="speed">0 км/ч</div></div>
  </div>

  <div id="controls">
    <button id="btnL">◀</button>
    <button id="btnR">▶</button>
  </div>

  <div id="overlay">
    <h1>ГОНКИ</h1>
    <div class="sub">Уворачивайся от машин и держись дороги</div>
    <div id="final" style="display:none"></div>
    <button id="startBtn">СТАРТ</button>
    <div class="keys">
      <b>←</b> / <b>→</b> — руль &nbsp;•&nbsp; <b>A</b> / <b>D</b> — тоже<br>
      На телефоне — кнопки внизу или свайп
    </div>
  </div>
</div>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const finalEl = document.getElementById('final');
  const scoreEl = document.querySelector('#score span');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');

  let W=0, H=0, DPR=Math.min(window.devicePixelRatio||1, 2);
  let road = { x:0, w:0 };

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    road.w = Math.min(W*0.78, 520);
    road.x = (W - road.w)/2;
  }
  window.addEventListener('resize', resize);
  resize();

  const LANES = 3;
  const laneW = () => road.w / LANES;
  const laneCenter = i => road.x + laneW()*(i+0.5);

  const CAR_W = () => Math.min(laneW()*0.62, 62);
  const CAR_H = () => CAR_W()*1.85;

  let state = 'menu'; // menu | play | over
  let player, enemies, particles, stripes, score, best, speed, spawnT, roadOffset, shake, time;

  best = Math.floor(+(localStorage.getItem('racing_best')||0));
  bestEl.textContent = 'Рекорд: ' + best;

  function reset(){
    player = { lane:1, x:laneCenter(1), y:H - CAR_H()*1.6, vx:0, tilt:0 };
    enemies = [];
    particles = [];
    stripes = [];
    score = 0; speed = 0; spawnT = 0; roadOffset = 0; shake = 0; time = 0;
    for(let i=0;i<40;i++) stripes.push({ y: Math.random()*H });
    scoreEl.textContent = '0';
  }

  // ---- input ----
  const keys = {};
  let touchX = null, swipeStart = null;

  window.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()] = true;
    if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault();
    if(e.key === ' ' && state !== 'play') start();
  });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  function pointerDown(x){ swipeStart = { x, t:performance.now() }; touchX = x; }
  function pointerMove(x){ if(touchX!==null) touchX = x; }
  function pointerUp(x){
    if(swipeStart){
      const dx = x - swipeStart.x;
      const dt = performance.now() - swipeStart.t;
      if(Math.abs(dx) > 30 && dt < 500){
        if(dx < 0) moveLane(-1); else moveLane(1);
      }
    }
    touchX = null; swipeStart = null;
  }

  cv.addEventListener('pointerdown', e=>pointerDown(e.clientX));
  cv.addEventListener('pointermove', e=>pointerMove(e.clientX));
  cv.addEventListener('pointerup', e=>pointerUp(e.clientX));
  cv.addEventListener('pointercancel', ()=>{ touchX=null; swipeStart=null; });

  document.getElementById('btnL').addEventListener('pointerdown', e=>{ e.preventDefault(); moveLane(-1); });
  document.getElementById('btnR').addEventListener('pointerdown', e=>{ e.preventDefault(); moveLane(1); });

  function moveLane(d){
    if(state !== 'play') return;
    const n = Math.max(0, Math.min(LANES-1, player.lane + d));
    if(n !== player.lane){ player.lane = n; player.tilt = d*0.35; }
  }

  // ---- game ----
  function start(){
    reset();
    state = 'play';
    overlay.classList.add('hide');
  }

  function gameOver(){
    state = 'over';
    shake = 18;
    score = Math.floor(score);
    if(score > best){ best = score; localStorage.setItem('racing_best', best); }
    bestEl.textContent = 'Рекорд: ' + Math.floor(best);
    finalEl.style.display = 'block';
    finalEl.innerHTML = 'Очки: <b>'+score+'</b><br><span style="font-size:14px;opacity:.7">Рекорд: '+Math.floor(best)+'</span>';
    startBtn.textContent = 'ЕЩЁ РАЗ';
    overlay.classList.remove('hide');
  }

  function spawnEnemy(){
    const lane = Math.floor(Math.random()*LANES);
    // не спавним, если близко к другому врагу в той же полосе
    for(const e of enemies){
      if(e.lane === lane && e.y < CAR_H()*2.2) return;
    }
    const colors = ['#ff5c5c','#ffb84a','#7c6bff','#3ddc97','#ff7ad9','#4ad6ff'];
    enemies.push({
      lane, x: laneCenter(lane), y: -CAR_H()*1.5,
      color: colors[Math.floor(Math.random()*colors.length)],
      vy: 0
    });
  }

  function burst(x,y,color,n){
    for(let i=0;i<n;i++){
      particles.push({
        x, y,
        vx:(Math.random()-0.5)*8,
        vy:(Math.random()-0.5)*8 - 2,
        life:1, color, size: 2+Math.random()*4
      });
    }
  }

  function update(dt){
    time += dt;
    if(state !== 'play'){
      if(shake > 0) shake *= 0.9;
      return;
    }

    // скорость растёт со временем
    speed = Math.min(1, time/45);
    const baseSpeed = 320 + speed*680; // px/sec
    roadOffset += baseSpeed*dt;
    score += dt * (10 + speed*40);

    // руль
    let steer = 0;
    if(keys['arrowleft']||keys['a']) steer -= 1;
    if(keys['arrowright']||keys['d']) steer += 1;
    if(touchX !== null){
      const target = Math.max(road.x+CAR_W()/2, Math.min(road.x+road.w-CAR_W()/2, touchX));
      player.x += (target - player.x) * Math.min(1, dt*10);
      player.tilt += ((target-player.x)*0.004 - player.tilt)*0.2;
    } else {
      const targetX = laneCenter(player.lane);
      player.x += (targetX - player.x) * Math.min(1, dt*9);
      player.tilt += (steer*0.3 - player.tilt) * Math.min(1, dt*10);
    }
    player.x = Math.max(road.x+CAR_W()/2, Math.min(road.x+road.w-CAR_W()/2, player.x));

    // спавн
    spawnT -= dt;
    if(spawnT <= 0){
      spawnEnemy();
      spawnT = Math.max(0.32, 0.95 - speed*0.55) * (0.75 + Math.random()*0.6);
    }

    // враги
    const pw = CAR_W(), ph = CAR_H();
    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      e.y += baseSpeed*dt;
      // мягкое доведение до центра полосы
      e.x += (laneCenter(e.lane) - e.x) * Math.min(1, dt*4);

      // столкновение
      if(Math.abs(e.x - player.x) < pw*0.82 && Math.abs(e.y - player.y) < ph*0.82){
        burst(player.x, player.y, '#ffd54a', 40);
        burst(e.x, e.y, e.color, 30);
        gameOver();
        return;
      }
      if(e.y > H + ph){ enemies.splice(i,1); score += 15; }
    }

    // частицы
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= dt*1.6;
      if(p.life <= 0) particles.splice(i,1);
    }

    // полосы разметки
    for(const s of stripes){
      s.y += baseSpeed*dt;
      if(s.y > H) s.y -= H + Math.random()*40;
    }

    if(shake > 0) shake *= 0.9;
    scoreEl.textContent = Math.floor(score);
    speedEl.textContent = Math.floor(60 + speed*240) + ' км/ч';
  }

  // ---- render ----
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawCar(x,y,w,h,color,tilt,isPlayer){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(tilt*0.25);
    // тень
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    roundRect(-w/2+3, -h/2+6, w, h, w*0.22); ctx.fill();
    // кузов
    const g = ctx.createLinearGradient(-w/2,0,w/2,0);
    g.addColorStop(0, shade(color,-30));
    g.addColorStop(0.5, color);
    g.addColorStop(1, shade(color,-45));
    ctx.fillStyle = g;
    roundRect(-w/2, -h/2, w, h, w*0.22); ctx.fill();
    // лобовое
    ctx.fillStyle = 'rgba(15,25,45,.85)';
    roundRect(-w*0.34, -h*0.30, w*0.68, h*0.26, w*0.1); ctx.fill();
    // заднее
    roundRect(-w*0.34, h*0.10, w*0.68, h*0.20, w*0.1); ctx.fill();
    // фары
    ctx.fillStyle = isPlayer ? '#fff6c0' : '#ff5c5c';
    roundRect(-w*0.40, -h*0.46, w*0.22, h*0.07, 3); ctx.fill();
    roundRect( w*0.18, -h*0.46, w*0.22, h*0.07, 3); ctx.fill();
    // колёса
    ctx.fillStyle = '#111';
    roundRect(-w*0.56, -h*0.34, w*0.14, h*0.22, 3); ctx.fill();
    roundRect( w*0.42, -h*0.34, w*0.14, h*0.22, 3); ctx.fill();
    roundRect(-w*0.56,  h*0.12, w*0.14, h*0.22, 3); ctx.fill();
    roundRect( w*0.42,  h*0.12, w*0.14, h*0.22, 3); ctx.fill();
    ctx.restore();
  }

  function shade(hex, amt){
    let c = hex.replace('#','');
    if(c.length===3) c = c.split('').map(x=>x+x).join('');
    let r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    r = Math.max(0,Math.min(255,r+amt)); g = Math.max(0,Math.min(255,g+amt)); b = Math.max(0,Math.min(255,b+amt));
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  function render(){
    ctx.save();
    if(shake > 0.5){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // фон — трава
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0e2a1c'); bg.addColorStop(1,'#07160f');
    ctx.fillStyle = bg; ctx.fillRect(-40,-40,W+80,H+80);

    // дорога
    const rg = ctx.createLinearGradient(road.x,0,road.x+road.w,0);
    rg.addColorStop(0,'#2a2f3a'); rg.addColorStop(0.5,'#3a4150'); rg.addColorStop(1,'#2a2f3a');
    ctx.fillStyle = rg;
    ctx.fillRect(road.x, -40, road.w, H+80);

    // обочины
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(road.x-6, -40, 6, H+80);
    ctx.fillRect(road.x+road.w, -40, 6, H+80);

    // разметка полос
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 4;
    ctx.setLineDash([34, 30]);
    ctx.lineDashOffset = -roadOffset % 64;
    for(let i=1;i<LANES;i++){
      const x = road.x + laneW()*i;
      ctx.beginPath(); ctx.moveTo(x,-40); ctx.lineTo(x,H+40); ctx.stroke();
    }
    ctx.setLineDash([]);

    // частицы
    for(const p of particles){
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // враги
    const w = CAR_W(), h = CAR_H();
    for(const e of enemies) drawCar(e.x, e.y, w, h, e.color, 0, false);

    // игрок
    if(state !== 'over') drawCar(player.x, player.y, w, h, '#ffd54a', player.tilt, true);

    // виньетка
    const vg = ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.85);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

    ctx.restore();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', start);
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
